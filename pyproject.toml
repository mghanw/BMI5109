[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intervention-cell-pdag"
version = "0.3.0"
description = "Intervention-informed CSCN, gene-space CKM, and average treatment contrasts"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.24,<1.28", "pandas>=2.0,<3", "scipy>=1.11",
    "scikit-learn>=1.2", "networkx>=3", "bitarray>=2", "threadpoolctl>=3.1",
]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]
io = ["openpyxl>=3.1", "anndata>=0.10"]

[tool.setuptools.packages.find]
include = ["icpdag*"]

[tool.setuptools.package-data]
"icpdag._vendor.cscn" = ["LICENSE", "upstream.json"]
